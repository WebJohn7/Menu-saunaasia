<!doctype html><html lang="cs"><head><meta charset="utf-8"><title>Menu Asia</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../menu/data.js"></script>
<style>body{margin:0;background:var(--paper-000)}a{color:var(--red-500)}a:hover{color:var(--red-400)}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="Contact.jsx"></script>
<script type="text/babel">
const { NavBar, Button, Toast } = window.MenuAsiaDesignSystem_345094;
function App(){
  const [page,setPage]=React.useState('Domů');
  const [toast,setToast]=React.useState(null);
  const sent=()=>{setToast('Rezervaci potvrdíme SMS zprávou.');setTimeout(()=>setToast(null),2800);};
  return <>
    <NavBar brand="Menu Asia" items={['Domů','Menu','Kontakt']} active={page} onNavigate={setPage}
      action={<Button size="sm" onClick={()=>setPage('Kontakt')}>Rezervace</Button>} />
    {page==='Domů' && <><Hero onOrder={()=>setPage('Menu')} /><Highlights /><Popular onOrder={()=>setPage('Menu')} /></>}
    {page==='Menu' && <Popular onOrder={()=>setPage('Kontakt')} />}
    {page==='Kontakt' && <Contact onSent={sent} />}
    <Footer />
    {toast && <div style={{position:'fixed',left:0,right:0,bottom:0}}><Toast tone="success" message={toast} /></div>}
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
