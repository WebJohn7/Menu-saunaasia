<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">

function Demo(){const[open,setOpen]=React.useState(false);
return <div className="stack" style={{gap:18}}>
<div className="row"><Button variant="dark" onClick={()=>setOpen(true)}>Otevřít dialog</Button></div>
<Toast tone="success" message="Pho přidáno do košíku" action={<Button variant="ghost" size="sm" style={{color:'var(--yellow-500)'}}>Zpět</Button>}/>
<Toast tone="danger" message="Položka je dnes vyprodaná"/>
<div style={{position:'relative',minHeight:140,border:'1px dashed var(--border-on-light)'}}>
<div style={{position:'absolute',inset:0,background:'var(--surface-overlay)',display:'flex',alignItems:'center',justifyContent:'center'}}>

<h3 style={{margin:0,padding:'14px 20px',fontFamily:'var(--font-heading)',fontSize:'var(--text-lg)',letterSpacing:'.02em',textTransform:'uppercase',borderBottom:'1px solid var(--border-on-light)'}}>Alergeny</h3>

</div>;}
