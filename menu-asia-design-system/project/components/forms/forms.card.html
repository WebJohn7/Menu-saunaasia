<!doctype html><html lang="cs"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;font-family:var(--font-body);background:var(--paper-000);color:var(--text-body)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:14px}.stack{display:grid;gap:14px}.lbl{font-family:var(--font-heading);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.55}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch } = window.MenuAsiaDesignSystem_345094;
function Demo(){const[c,setC]=React.useState(true);const[r,setR]=React.useState('kuřecí');const[s,setS]=React.useState(true);
return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'24px 32px'}}>
<Input label="Jméno" placeholder="Jan Novák"/>
<Select label="Maso" options={['kuřecí','hovězí','krevety','tofu']}/>
<Input label="Telefon" defaultValue="+420 777" invalid hint="Zadejte celé číslo"/>
<div className="stack"><span className="lbl">Radio</span><Radio name="m" value={r} onChange={setR} options={['kuřecí','hovězí','tofu']}/></div>
<div className="stack"><span className="lbl">Checkbox</span><Checkbox label="Bez arašídů" checked={c} onChange={e=>setC(e.target.checked)}/><Checkbox label="S sebou" checked={false} onChange={()=>{}}/><Checkbox label="Nedostupné" checked={false} disabled onChange={()=>{}}/></div>
<div className="stack"><span className="lbl">Switch</span><Switch checked={s} onChange={e=>setS(e.target.checked)} label="Jen vegetariánské"/><Switch checked={false} onChange={()=>{}} label="Rozvoz"/></div>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
