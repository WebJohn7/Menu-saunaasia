<!doctype html><html lang="cs"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;font-family:var(--font-body);background:var(--ink-900);color:var(--text-on-dark)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:14px}.stack{display:grid;gap:14px}.lbl{font-family:var(--font-heading);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.55}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Tag, Badge, Card, Divider } = window.MenuAsiaDesignSystem_345094;
function Demo(){const[sel,setSel]=React.useState('Polévky');return <div className="stack">
<div className="row"><Button>Objednat</Button><Button variant="dark">Rezervace</Button><Button variant="danger">Zrušit</Button><Button variant="outline">Detail</Button><Button variant="ghost">Více</Button><Button disabled>Vyprodáno</Button></div>
<div className="row"><Button size="sm">Small</Button><Button size="md">Medium</Button><Button size="lg">Large</Button><IconButton tone="onDark" label="Košík">⌘</IconButton></div>
<Divider heavy tone="onDark"/>
<div className="row">{['Předkrmy','Polévky','Nudle','Rýže'].map(t=><Tag key={t} tone="onDark" selected={sel===t} onClick={()=>setSel(t)}>{t}</Tag>)}</div>
<div className="row"><Badge tone="allergen" round>7</Badge><Badge tone="allergen" round>11</Badge><Badge tone="spicy">Pikantní</Badge><Badge tone="veg">Vege</Badge><Badge tone="gold">Novinka</Badge><Badge tone="yellow">Top</Badge></div>
<div className="row" style={{alignItems:'stretch'}}><Card tone="dark" style={{width:300}}><div className="lbl">Card · dark</div><div style={{marginTop:6}}>Ploché, hranaté, bez zaoblení.</div></Card><Card tone="light" style={{width:300}}><div className="lbl">Card · light</div><div style={{marginTop:6}}>Na mramorových stránkách.</div></Card></div>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
