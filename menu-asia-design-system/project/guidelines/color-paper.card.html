<!doctype html><html lang="cs"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;font-family:var(--font-body);background:var(--paper-000);color:var(--text-body)}.sw{display:flex;gap:0}.sw>div{flex:1;height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;font-family:var(--font-heading);font-size:10px;letter-spacing:.06em;text-transform:uppercase}.hex{font-family:var(--font-body);font-size:11px;letter-spacing:0;opacity:.75;text-transform:none}</style></head><body><div class="sw"><div style="background:var(--paper-000);color:#111"><span>paper 000</span><span class="hex">#FFFFFF</span></div><div style="background:var(--paper-100);color:#111"><span>paper 100</span><span class="hex">#F5F4F1</span></div><div style="background:var(--paper-200);color:#111"><span>paper 200</span><span class="hex">#EAE8E3</span></div><div style="background:var(--paper-300);color:#111"><span>paper 300</span><span class="hex">#D8D5CE</span></div><div style="background:var(--paper-400);color:#111"><span>paper 400</span><span class="hex">#B9B5AC</span></div></div></body></html>
