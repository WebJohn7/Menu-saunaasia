<!-- @dsCard group="Colors" viewport="700x180" name="Semantic pairs" subtitle="Text and price colour per ground" -->
<!doctype html><html lang="cs"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;font-family:var(--font-body);background:var(--paper-000);color:var(--text-body)}.sw{display:flex;gap:0}.sw>div{flex:1;height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;font-family:var(--font-heading);font-size:10px;letter-spacing:.06em;text-transform:uppercase}.hex{font-family:var(--font-body);font-size:11px;letter-spacing:0;opacity:.75;text-transform:none}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div style="background:var(--ink-900);padding:14px">
<div style="font-family:var(--font-heading);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--yellow-500)">on dark</div>
<div style="color:var(--text-on-dark);font:var(--type-body)">--text-on-dark · #FFFFFF</div>
<div style="color:var(--text-on-dark-muted);font:var(--type-body)">--text-on-dark-muted · #CFCCC6</div>
<div style="color:var(--price-on-dark);font:var(--type-body);font-weight:700">--price-on-dark · #FFE500</div></div>
<div style="background:var(--paper-100);padding:14px">
<div style="font-family:var(--font-heading);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--red-500)">on light</div>
<div style="color:var(--text-strong);font:var(--type-body)">--text-strong · #0A0A0A</div>
<div style="color:var(--text-muted);font:var(--type-body)">--text-muted · #55524C</div>
<div style="color:var(--price-on-light);font:var(--type-body);font-weight:700">--price-on-light · #E11B22</div></div></div></body></html>
