<!-- @dsCard group="Brand" viewport="700x160" name="States" subtitle="Hover lightens, press drops 1px, focus is a yellow ring" -->
<!doctype html><html lang="cs"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;font-family:var(--font-body);background:var(--paper-000);color:var(--text-body)}.sw{display:flex;gap:0}.sw>div{flex:1;height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;font-family:var(--font-heading);font-size:10px;letter-spacing:.06em;text-transform:uppercase}.hex{font-family:var(--font-body);font-size:11px;letter-spacing:0;opacity:.75;text-transform:none}</style></head><body><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-family:var(--font-heading);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase">
<span style="padding:11px 20px;background:var(--yellow-500);color:var(--ink-900);border:2px solid var(--yellow-500)">Rest</span>
<span style="padding:11px 20px;background:var(--yellow-400);color:var(--ink-900);border:2px solid var(--yellow-400)">Hover</span>
<span style="padding:11px 20px;background:var(--yellow-600);color:var(--ink-900);border:2px solid var(--yellow-600);transform:translateY(1px)">Press</span>
<span style="padding:11px 20px;background:var(--yellow-500);color:var(--ink-900);border:2px solid var(--ink-900);box-shadow:0 0 0 3px var(--yellow-400)">Focus</span>
<span style="padding:11px 20px;background:var(--yellow-500);color:var(--ink-900);border:2px solid var(--yellow-500);opacity:.4">Disabled</span></div>
<div style="font-family:var(--font-heading);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.55;margin-top:12px">120ms · cubic-bezier(.2,.7,.3,1) · no bounce, no scale</div></body></html>
